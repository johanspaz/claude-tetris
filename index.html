<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <button id="theme-toggle" type="button">Modo claro</button>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <select id="skin-select" aria-label="Skin visual"></select>
        </div>

        <div class="panel-section records">
          <span class="label">TOP 5</span>
          <table class="records-table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th class="num">Puntos</th>
                <th class="num" title="Mejor combo de la partida">Combo</th>
                <th class="num" title="Máximo de líneas en una jugada">Líneas</th>
              </tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <button id="clear-records-btn" class="danger-btn" type="button">Borrar records</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <p id="overlay-stats" class="overlay-stats hidden"></p>

          <form id="record-form" class="record-form hidden">
            <label class="record-label" for="record-name">¡Entras en el top 5! Escribe tu nombre</label>
            <input id="record-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="record-save" class="menu-btn" type="submit">Guardar</button>
            <p id="record-error" class="record-error"></p>
          </form>

          <div id="overlay-records" class="overlay-records hidden">
            <table class="records-table">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th class="num">Puntos</th>
                  <th class="num" title="Mejor combo de la partida">Combo</th>
                  <th class="num" title="Máximo de líneas en una jugada">Líneas</th>
                </tr>
              </thead>
              <tbody id="overlay-records-body"></tbody>
            </table>
            <button id="overlay-clear-records-btn" class="danger-btn" type="button">Borrar records</button>
          </div>

          <button id="restart-btn">Reiniciar</button>

          <div id="pause-menu" class="pause-menu">
            <button id="resume-btn" class="menu-btn" type="button">Reanudar</button>
            <button id="pause-restart-btn" class="menu-btn" type="button">Reiniciar</button>
            <button id="controls-btn" class="menu-btn" type="button">Ver controles</button>
            <label class="level-select">
              <span>Nivel inicial <small>(se aplica al reiniciar)</small></span>
              <select id="start-level">
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
            </label>
          </div>

          <div id="controls-view" class="controls-view hidden">
            <ul class="keys">
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
            </ul>
            <button id="back-btn" class="menu-btn" type="button">Volver</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
